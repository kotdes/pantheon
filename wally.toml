[package]
name = "koterahq/pantheon"
version = "0.1.0"
license = "MIT"
authors = ["7kayoh"]
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
description = "Pantheon is a modern and slick Fusion 0.3+ components library for Roblox, with a focus on accessibility, theming, and performance."
repository = "https://github.com/kotdes/pantheon"
homepage = "https://github.com/kotdes/pantheon"
include = ["src", "src/**", "default.project.json", "wally.toml", "README.md", "LICENSE"]
exclude = ["**"]

[dependencies]
Fusion = "elttob/fusion@0.3.0"
Lucide = "latte-soft/lucide-icons@0.1.3"
Iona = "koterahq/iona@0.3.0"
Snapdragon = "vorlias/snapdragon@2.0.0"

[dev-dependencies]
TopbarPlus = "legitatx/topbarplus@3.0.5"
