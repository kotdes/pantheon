site_name: Pantheon
site_url: https://pantheon.7kayoh.net/
site_description: User interface components for Roblox, built on Fusion.
repo_name: kotdes/pantheon
repo_url: https://github.com/kotdes/pantheon
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/branding/pantheon-icon.svg
  favicon: assets/branding/pantheon-icon.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Dark theme
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Light theme
  font:
    text: Figtree
    code: Overpass Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - content.action.edit
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

  language: en

hooks:
  - hooks/page_description.py

plugins:
  - search
  # Social cards need Cairo, so they are off for local builds. Set CARDS=true to build them.
  - social:
      enabled: !ENV [CARDS, false]
      cards_layout_dir: layouts
      cards_layout: pantheon
  - tags:
      tags_file: Tags.md
  - glightbox

markdown_extensions:
  - admonition
  - toc:
      permalink: true
      title: On this page
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - tables

